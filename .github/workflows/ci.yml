name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            DocumentProcessing.Web/package-lock.json

      - name: Restore .NET
        run: dotnet restore DocumentProcessing.slnx

      - name: Build .NET
        run: dotnet build DocumentProcessing.slnx --configuration Release --no-restore

      - name: Install OCR tools
        run: sudo apt-get update -q && sudo apt-get install -y -q tesseract-ocr tesseract-ocr-nld poppler-utils

      - name: Test .NET
        run: dotnet test DocumentProcessing.slnx --configuration Release --no-build

      - name: Install evaluation tooling
        run: npm ci

      - name: Verify synthetic dataset generation
        run: |
          npm run dataset:generate
          git diff --exit-code -- evaluation-data/invoices.jsonl

      - name: Test evaluation tooling
        run: npm test

      - name: Run baseline evaluation report
        run: npm run evaluate

      - name: Install frontend dependencies
        run: npm ci --prefix DocumentProcessing.Web

      - name: Test frontend
        run: npm --prefix DocumentProcessing.Web test

      - name: Build frontend
        run: npm --prefix DocumentProcessing.Web run build

      - name: Validate Azure infrastructure
        run: |
          az bicep build --file infra/main.bicep --stdout > /dev/null
          shellcheck infra/*.sh

      - name: Validate Docker Compose
        run: docker compose --env-file .env.example config --quiet

      - name: Build container images
        run: docker compose --env-file .env.example build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: DocumentProcessing.Web/package-lock.json

      - name: Configure Compose
        run: |
          cp .env.example .env
          sed -i \
            -e "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=$(openssl rand -hex 16)/" \
            -e "s/^APP_DB_PASSWORD=.*/APP_DB_PASSWORD=$(openssl rand -hex 16)/" \
            -e "s/^DEMO_ADMIN_PASSWORD=.*/DEMO_ADMIN_PASSWORD=E2e-$(openssl rand -hex 16)/" \
            .env

      - name: Start the stack
        run: docker compose up -d --build --wait

      - name: Install frontend dependencies
        run: npm ci --prefix DocumentProcessing.Web

      - name: Install Playwright browser
        working-directory: DocumentProcessing.Web
        run: npx playwright install --with-deps chromium

      - name: Browser smoke test
        working-directory: DocumentProcessing.Web
        run: |
          set -a; . ../.env; set +a
          E2E_BASE_URL="http://127.0.0.1:${WEB_PORT}" E2E_USERNAME="$DEMO_ADMIN_USERNAME" E2E_PASSWORD="$DEMO_ADMIN_PASSWORD" npm run e2e

      - name: Compose logs
        if: failure()
        run: docker compose logs --no-color

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            DocumentProcessing.Web/playwright-report
            DocumentProcessing.Web/test-results
          retention-days: 7
