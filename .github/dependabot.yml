version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      microsoft:
        patterns: ["Microsoft.*", "System.*"]
      efcore-npgsql:
        patterns: ["Npgsql*"]
      opentelemetry:
        patterns: ["OpenTelemetry*"]
      test:
        patterns: ["xunit*", "Moq", "FluentAssertions", "coverlet*", "Testcontainers*", "Microsoft.NET.Test.Sdk"]
  - package-ecosystem: npm
    directory: /DocumentProcessing.Web
    schedule:
      interval: weekly
    groups:
      web:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directories: ["/DocumentProcessing.Api", "/DocumentProcessing.Worker", "/DocumentProcessing.Web", "/"]
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
